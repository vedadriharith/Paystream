spring.application.name=api-gateway
server.port=8080

spring.threads.virtual.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id=payment-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/payments/**,/api/v1/accounts/**,/api/v1/auth/**

# Route: payment-service actuator (dev only, used to verify routing; locked down in Phase 6)
spring.cloud.gateway.server.webmvc.routes[1].id=payment-service-actuator
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/payment-service/actuator/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always