spring.application.name=ledger-service
server.port=8082

# Java 21 virtual threads for request handling and Kafka listeners
spring.threads.virtual.enabled=true

# Database: ledger-service owns ledger_db only
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=${DB_USERNAME:paystream}
spring.datasource.password=${DB_PASSWORD:paystream}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
# All ledger-service instances share this group, so partitions are divided between them
spring.kafka.consumer.group-id=ledger-service
# A brand-new group starts from the oldest retained event so no payment is skipped
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Commit the offset after each record is processed successfully
spring.kafka.listener.ack-mode=record