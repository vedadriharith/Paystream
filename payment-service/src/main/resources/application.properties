spring.application.name=payment-service
server.port=8081

# Java 21 virtual threads for request handling
spring.threads.virtual.enabled=true

# Database: payment-service owns payment_db only
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=${DB_USERNAME:paystream}
spring.datasource.password=${DB_PASSWORD:paystream}

# Flyway owns the schema; Hibernate only validates it against entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Trust X-Forwarded-* headers from the gateway so generated URLs point to the gateway, not this instance
server.forward-headers-strategy=framework

# Kafka producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait for all in-sync replicas before a send counts as successful
spring.kafka.producer.acks=all
# Broker discards duplicates caused by producer retries
spring.kafka.producer.properties.enable.idempotence=true

# Kafka producer: fail fast; the outbox publisher owns retries, not the producer's in-memory buffer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Outbox publisher
paystream.outbox.enabled=true
paystream.outbox.poll-interval-ms=500
paystream.outbox.batch-size=50
paystream.outbox.send-timeout-ms=10000
paystream.outbox.alert-after-attempts=5