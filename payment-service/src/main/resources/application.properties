spring.application.name=payment-service
server.port=8081

# Java 21 virtual threads for request handling
spring.threads.virtual.enabled=true

# Database: payment-service owns payment_db only
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=${DB_USERNAME:paystream}
spring.datasource.password=${DB_PASSWORD:paystream}

# Flyway owns the schema; Hibernate only validates it against entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Register with Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Trust X-Forwarded-* headers from the gateway so generated URLs point to the gateway, not this instance
server.forward-headers-strategy=framework